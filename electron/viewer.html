<!doctype html><html><head><meta charset="utf-8"><title>Badbounce Progress</title>
<style>
:root{--bg:#05080F;--card:#0E1626;--line:#1D2A44;--tx:#F2F5FB;--dim:#8B97B3;--acc:#FFC63A;--ok:#3DDC97}
[data-theme=medium]{--bg:#1B2436;--card:#27324A;--line:#3A4766;--tx:#F2F5FB;--dim:#A9B4CE}
[data-theme=light]{--bg:#EEF1F7;--card:#FFFFFF;--line:#D5DBE8;--tx:#111827;--dim:#5B667F;--acc:#D98E00;--ok:#14935E}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,sans-serif;overflow:hidden;cursor:default}
#grid{height:100vh;padding:1.6vmin;display:grid;gap:1.6vmin;grid-template-columns:repeat(var(--c,1),1fr);grid-auto-rows:1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:2vmin;padding:2vmin 2.4vmin;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.card.live{border-color:var(--acc);box-shadow:0 0 3vmin color-mix(in srgb,var(--acc) 25%,transparent)}
.card.sub{margin-left:0;opacity:.92}
.hd{display:flex;align-items:baseline;gap:1.2vmin;margin-bottom:1.2vmin}
.t{font-weight:700;font-size:calc(var(--fs)*1.25);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n{color:var(--dim);font-size:calc(var(--fs)*.8);white-space:nowrap}
.bar{height:.9vmin;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:1.4vmin}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.card.fin .bar i{background:var(--ok)}
.st{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.7vmin}
.s{display:flex;gap:1.2vmin;font-size:var(--fs);line-height:1.25;align-items:flex-start}
.s b{width:1.4em;flex:none;text-align:center;color:var(--dim)}
.s.done{color:var(--dim)}.s.done b{color:var(--ok)}
.s.active{font-weight:700}.s.active b{color:var(--acc);animation:p 1.2s infinite}
.s span{flex:1}
@keyframes p{50%{opacity:.25}}
.empty{height:100vh;display:grid;place-items:center;color:var(--dim);font-size:3vmin}
</style></head><body>
<div id="grid"></div>
<script>
const g=document.getElementById('grid');let list=[],cfg={sound:true,theme:'dark'},prev={},first=true;
const ICON={done:'✓',active:'●',pending:'○'};
const age=(ms)=>{const s=Math.max(0,(Date.now()-ms)/1e3|0);return s<60?'now':s<3600?(s/60|0)+' min':(s/3600|0)+' h'};
function chime(kind){if(!cfg.sound)return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),t=a.currentTime;
 (kind==='all'?[660,880,1320]:[880]).forEach((f,i)=>{const o=a.createOscillator(),v=a.createGain();o.type='sine';o.frequency.value=f;o.connect(v);v.connect(a.destination);
 v.gain.setValueAtTime(0,t+i*.13);v.gain.linearRampToValueAtTime(.12,t+i*.13+.02);v.gain.exponentialRampToValueAtTime(.001,t+i*.13+.5);o.start(t+i*.13);o.stop(t+i*.13+.55)});}catch{}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
 document.documentElement.dataset.theme=cfg.theme||'dark';
 if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">No tasks right now</div>';return}
 const n=list.length,cols=n<=1?1:n<=4?2:n<=9?3:4,rows=Math.ceil(n/cols);
 g.style.setProperty('--c',cols);g.style.gridTemplateRows=`repeat(${rows},1fr)`;
 const maxSteps=Math.max(...list.map(c=>c.steps.length),1);
 const h=window.innerHeight/rows;const fs=Math.max(13,Math.min(h/(maxSteps+3.5)*.62,window.innerWidth/cols/22));
 g.style.setProperty('--fs',fs+'px');
 g.innerHTML=list.map(c=>{const d=c.steps.filter(s=>s.state==='done').length,p=Math.round(d/c.steps.length*100);
  return `<div class="card${c.live?' live':''}${c.parent?' sub':''}${d===c.steps.length?' fin':''}"><div class="hd"><div class="t">${esc(c.title)}</div><div class="n">${d}/${c.steps.length} · ${age(c.updated)}</div></div><div class="bar"><i style="width:${p}%"></i></div><div class="st">${c.steps.map(s=>`<div class="s ${s.state}"><b>${ICON[s.state]}</b><span>${esc(s.state==='active'&&s.now?s.now:s.label)}</span></div>`).join('')}</div></div>`}).join('');
}
function update(l){
 let step=false,all=false;const nx={};
 for(const c of l){const k=c.steps.map(s=>s.state==='done'?1:0);nx[c.id]=k;const o=prev[c.id];
  if(o){if(k.filter(Boolean).length>o.filter(Boolean).length)step=true;if(k.every(Boolean)&&!o.every(Boolean))all=true}}
 prev=nx;list=l;render();if(!first){if(all)chime('all');else if(step)chime('step')}first=false}
bbViewer.onTasks(update);bbViewer.onConfig(c=>{cfg=Object.assign(cfg,c);render()});
bbViewer.ready();
setInterval(render,30000);window.addEventListener('resize',render);
// simple full screen: double click or F11 (handled by the launcher)
document.addEventListener('dblclick',()=>bbViewer.toggleFull());
</script></body></html>
